services:
  - type: web
    name: jualemas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: PAYMENT_TOKEN
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SEED_DATABASE
        value: "false"

# PostgreSQL harus disediakan dari provider terpisah, misalnya Neon.
# Nilai DB_URL dan PAYMENT_TOKEN diisi melalui dashboard Render.
