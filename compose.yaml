name: jualemas

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jualemas-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      PAYMENT_TOKEN: local-test-token
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: jualemas-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jualemas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jualemas"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: