name: jualemas

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jualemas-app
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./.env:/var/www/html/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-jualemas}
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      PAYMENT_TOKEN: ${PAYMENT_TOKEN:-local-test-token}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      SEED_DATABASE: ${SEED_DATABASE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: jualemas-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jualemas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jualemas"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro

volumes:
  postgres_data: